apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: hotel-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: hotel-postgres}
  template:
    metadata:
      labels: {app: hotel-postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16.15
          args: [postgres, -c, shared_buffers=64MB, -c, max_connections=100]
          env:
            - {name: POSTGRES_USER, value: lab}
            - {name: POSTGRES_DB, value: hotel}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: hotel-local, key: database-password}
          ports: [{containerPort: 5432}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 384Mi}
          readinessProbe:
            exec:
              command: [pg_isready, -h, '127.0.0.1', -U, lab, -d, hotel]
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: init
          configMap: {name: hotel-init-sql}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
