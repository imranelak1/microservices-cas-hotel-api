apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-rest
  template:
    metadata:
      labels:
        app: hotel-rest
    spec:
      containers:
      - name: api
        image: course7-hotel-rest:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 19601
          name: http
        envFrom:
        - configMapRef:
            name: hotel-api-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hotel-local
              key: database-password
        - name: HOTEL_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: hotel-local
              key: jwt-secret
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: hotel-local
              key: jwt-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 384Mi
        startupProbe:
          httpGet:
            path: /actuator/health
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: http
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rest-api
spec:
  selector:
    app: hotel-rest
  ports:
  - name: http
    port: 19601
    targetPort: http
---
