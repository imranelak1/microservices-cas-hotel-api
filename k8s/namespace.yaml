apiVersion: v1
kind: Namespace
metadata:
  name: hotel-lab
---
apiVersion: v1
kind: Secret
metadata:
  name: hotel-local
type: Opaque
stringData:
  database-password: labpass
  jwt-secret: course7-hotel-local-secret-32-characters-minimum
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-api-config
data:
  DB_URL: jdbc:postgresql://postgres:5432/hotel
  DB_USER: lab
  DATABASE_URL: postgresql://lab:labpass@postgres:5432/hotel
  JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
