name: course7-hotel-tls
services:
  ingress:
    image: nginx:1.27.4
    mem_limit: 64m
    cpus: 1
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:19701:7441", "127.0.0.1:19702:7442", "127.0.0.1:19703:7443", "127.0.0.1:19705:7445"]
    volumes:
      - ./security/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.tls:/etc/nginx/certs:ro
