events {}
http {
  ssl_certificate /etc/nginx/certs/localhost.crt;
  ssl_certificate_key /etc/nginx/certs/localhost.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 2m;
  server {
    listen 7441 ssl;
    location / { proxy_pass http://host.docker.internal:19601; }
  }
  server {
    listen 7442 ssl;
    location / { proxy_pass http://host.docker.internal:19602; }
  }
  server {
    listen 7443 ssl;
    location / { proxy_pass http://host.docker.internal:19603; }
  }
  server {
    listen 7445 ssl;
    http2 on;
    location / {
      grpc_set_header Authorization $http_authorization;
      grpc_pass grpc://host.docker.internal:19605;
    }
  }
}
