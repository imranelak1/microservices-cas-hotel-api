apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hotel-lab
resources:
  - k8s/namespace.yaml
  - k8s/database.yaml
  - k8s/apis.yaml
  - k8s/frontend.yaml
configMapGenerator:
  - name: hotel-init-sql
    files: [database/init.sql]
  - name: hotel-nginx
    files: [default.conf=k8s/nginx.conf]
