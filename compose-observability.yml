name: course7-hotel-observability
services:
  prometheus:
    image: prom/prometheus:v2.42.0
    mem_limit: 128m
    ports: ["127.0.0.1:19690:9090"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:9.5.1
    mem_limit: 192m
    ports: ["127.0.0.1:19630:3000"]
    environment: {GF_SECURITY_ADMIN_USER: student, GF_SECURITY_ADMIN_PASSWORD: labpassword}
    volumes:
      - ./monitoring/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/dashboard.json:/var/lib/grafana/dashboards/hotel.json:ro
  jaeger:
    image: jaegertracing/all-in-one:1.41.0
    mem_limit: 256m
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["127.0.0.1:19686:16686", "127.0.0.1:19618:4318"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.7.0
    mem_limit: 768m
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms256m -Xmx256m
    ports: ["127.0.0.1:19692:9200"]
  logstash:
    image: docker.elastic.co/logstash/logstash:8.7.0
    mem_limit: 512m
    environment: {LS_JAVA_OPTS: -Xms128m -Xmx256m, XPACK_MONITORING_ENABLED: "false"}
    ports: ["127.0.0.1:19644:5000"]
    volumes: ["./monitoring/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro"]
    depends_on: [elasticsearch]
  kibana:
    image: docker.elastic.co/kibana/kibana:8.7.0
    mem_limit: 512m
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: --max-old-space-size=256
    ports: ["127.0.0.1:19656:5601"]
    depends_on: [elasticsearch]
