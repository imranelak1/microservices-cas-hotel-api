server.port=19604
spring.application.name=hotel-grpc-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:19632/hotel}
spring.datasource.username=${DB_USER:lab}
spring.datasource.password=${DB_PASSWORD:labpass}
spring.datasource.hikari.maximum-pool-size=20
management.endpoints.web.exposure.include=health,metrics,prometheus
logging.level.root=WARN
debug=false
grpc.server.port=19605
management.metrics.distribution.percentiles-histogram.http.server.requests=true
